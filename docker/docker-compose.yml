version: "3.9"

# Local development infrastructure for the Repository Intelligence Engine.
# Scope (Checkpoint 0.1): PostgreSQL + Redis only.
# Elasticsearch, ClickHouse, Neo4j are deliberately excluded until the
# milestones that need them (see IMPLEMENTATION_ROADMAP.md).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rie_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rie_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-repository_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rie_dev} -d ${POSTGRES_DB:-repository_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rie_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
