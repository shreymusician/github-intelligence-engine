# Alembic Configuration
#
# This file contains the configuration needed to get Alembic working.
# See the documentation for instructions on how to create your own alembic.ini
# file with `alembic init`.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# System of version numbering with sequence-based numbering
version_location_validation = version_location

# Logging configuration
sqlalchemy.url = driver://user:password@localhost/dbname

# Whether to run migrations in transactions
transaction_isolation =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
